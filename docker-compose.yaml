services:

    namenode:
        image: apache/hadoop:3 
        container_name: namenode
        hostname: namenode
        ports:
            - "9870:9870" # NameNode Web UI
        env_file: "./config.txt"
        command: hdfs namenode
        networks:
            - mynetwork

    datanode:
        image: apache/hadoop:3 
        hostname: datanode
        container_name: datanode
        depends_on: 
            - namenode
        env_file: "./config.txt"
        command: hdfs datanode
        networks:
            - mynetwork

    hive:
        image: apache/hive:3.1.3
        hostname: hive
        container_name: hive
        depends_on:
            - namenode 
        environment:
            - SERVICE_NAME=hiveserver2
        ports:
            - "10000:10000"  # Hive server2 port
            - "10002:10002"    # Hive Metastore port
        volumes:
            - ./data/userdata:/userdata
            - ./data/schema:/schema
        networks:
            - mynetwork    

    db:
        container_name: mydb
        image: mysql:latest
        environment:
            MYSQL_ROOT_PASSWORD: root      
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin
            MYSQL_DATABASE: proyecto2
        healthcheck:  # sanity check de MySQL
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            retries: 5
        volumes:
            - ./mysqlFiles:/docker-entrypoint-initdb.d  # Script de inicialización
        ports:
            - "32001:3306"  
        networks:
            - mynetwork

    sqoop:
        image: dvoros/sqoop:latest
        container_name: sqoop
        depends_on:
            - db
            - namenode
        volumes:
            - ./sqoopFiles/jdbc:/jdbc  # Conector JDBC 
            - ./sqoopFiles/core-site.xml.template:/usr/local/hadoop/etc/hadoop/core-site.xml.template  # Sobrescribe core-site.xml.template
        networks:
            - mynetwork
        tty: true
        stdin_open: true

    grafana:
        container_name: grafana
        image: grafana/grafana:latest
        restart: unless-stopped
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
        ports:
            - 3000:3000  # Interfaz de Grafana
        networks:
            - mynetwork

    superset:
        container_name: superset
        image: acpmialj/ipmd:ssuperset
        ports:
            - 8080:8088
        networks:
            - mynetwork
        
networks:
    mynetwork:
        driver: bridge
        name: mynetwork  # Definición de red personalizada



