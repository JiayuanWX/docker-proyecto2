services:

    namenode:
        container_name: namenode
        hostname: namenode
        environment:
            - HDFS_NAMENODE_USER=hdfs
            - HDFS_DATANODE_USER=hdfs
            - HDFS_SECONDARYNAMENODE_USER=hdfs
            - CLUSTER_NAME=hadoop-cluster
            - HDFS_NAMENODE_USER=root
            - HADOOP_SSH_OPTS="-o StrictHostKeyChecking=no"
        volumes:
            - ./hadoop/namenode/data:/hadoop/dfs/name
        ports:
            - "9870:9870" # NameNode Web UI
            - "9000:9000" # NameNode RPC
        networks:
            - mynetwork

    datanode:
        container_name: datanode
        hostname: datanode
        environment:
            - HDFS_NAMENODE_USER=hdfs
            - HDFS_DATANODE_USER=hdfs
            - HDFS_SECONDARYNAMENODE_USER=hdfs
        volumes:
            - ./hadoop/datanode/data:/hadoop/dfs/data
        ports:
            - "9864:9864" # DataNode Web UI
        networks:
            - mynetwork

    hive:
        image: apache/hive:3.1.3
        container_name: hive
        environment:
            - HIVE_METASTORE_URI=thrift://postgres:9083
            - HADOOP_HOME=/opt/hadoop
        ports:
            - "10000:10000"  # Hive server2 port
            - "9083:9083"    # Hive Metastore port
        networks:
            - mynetwork

networks:
    mynetwork:
        driver: bridge
        name: mynetwork  # Definición de red personalizada


