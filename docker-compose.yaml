services:

    namenode:
        image: apache/hadoop:3 
        container_name: namenode
        hostname: namenode
        ports:
            - "9870:9870" # NameNode Web UI
        networks:
            - mynetwork
        env_file: "./config.txt"
        command: hdfs namenode

    datanode:
        image: apache/hadoop:3 
        hostname: datanode
        container_name: datanode
        depends_on: 
            - namenode
        networks:
            - mynetwork
        env_file: "./config.txt"
        command: hdfs datanode


    hive:
        image: apache/hive:3.1.3
        hostname: hive
        container_name: hive
        depends_on:
            - namenode 
        environment:
            - SERVICE_NAME=hiveserver2
        ports:
            - "10000:10000"  # Hive server2 port
            - "10002:10002"    # Hive Metastore port
        volumes:
            - ./userdata:/userdata
            - ./userschemas:/userschemas
            - ./init-hive.sql:/docker-entrypoint-initdb.d/init-hive.sql
            - ./init-hive.sh:/docker-entrypoint-initdb.d/init-hive.sh
        networks:
            - mynetwork
        command: ["/bin/bash", "-c", "/docker-entrypoint-initdb.d/init-hive.sh"]
    


        
networks:
    mynetwork:
        driver: bridge
        name: mynetwork  # Definición de red personalizada


